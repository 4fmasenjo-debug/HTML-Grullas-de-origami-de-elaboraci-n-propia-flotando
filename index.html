<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Origami Animado</title>
  <style>
    body {
      margin: 0;
      background: #fdf6e3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    svg {
      width: 200px;
      height: 200px;
      transform-origin: center;
      animation: flotar 4s ease-in-out infinite;
    }
    
    polygon {
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-10px) scale(1.05);
      }
    }
  </style>
</head>
<body>
 <!-- SVG de grulla de origami mía-->
  <svg viewBox="0 0 280 300">
    <polygon points="50,150 45,111 65,123" fill="#43486B"/> <!-- cabeza 1-->
    <polygon points="165,30 210,160 115,160" fill="#D9AC1A"/> <!-- ala arriba -->
    <polygon points="55,89 49,111 115,160 135,127" fill="#E81E2F"/> <!-- cuello -->
    <polygon points="50,150 49,111 65,123" fill="#5D3DC7"/> <!-- cabeza 2-->  
    <polygon points="170,150 210,160 250,55" fill="#DB2134"/> <!-- cola --> 
    <polygon points="165,80 210,160 115,160" fill="#16C453"/> <!-- Cuerpo -->
    <polygon points="165,300 210,160 115,160" fill="#FFCC1F"/> <!-- ala abajo --> 
  
  </svg>

</html>
